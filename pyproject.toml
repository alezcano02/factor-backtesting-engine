[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorbt"
version = "0.1.0"
description = "A small engine to backtest cross-sectional equity factor strategies"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[tool.setuptools]
packages = ["factorbt"]
